name: KeyNav Firefox popup diagnostics
on:
  push:
    branches: [codex/firefox-popup-diagnostics]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --locked
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: KeyNav-popup-diagnostics
          path: target/release/keynav.exe
          if-no-files-found: error
